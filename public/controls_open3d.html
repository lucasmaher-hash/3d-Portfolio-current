<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/images/site/favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="/images/site/favicon-32.png" />
  <link rel="apple-touch-icon" href="/images/site/favicon-180.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Controls</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- Roboto Flex is the site's body face; added for .card-description, which no
       longer uses the VT323 pixel font (headings still do). -->
  <link href="https://fonts.googleapis.com/css2?family=VT323&family=Roboto+Flex:wdth@100&display=swap" rel="stylesheet" />
  <style>
    @font-face {
      font-family: 'OCR-A-BT';
      src: url('/OCR-A-BT.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
    }

    :root {
      --bg-base: #DCDCE3;
      --bg-surface: #DCDCE3;
      --text-primary: #1A1A1A;
      --text-secondary: #8E8E93;
      --shadow-raised-sm: 5px 5px 12px rgba(174,174,192,0.65), -5px -5px 12px rgba(255,255,255,1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; }
    body { background: var(--bg-base); font-family: 'VT323', monospace; padding: 32px; display: flex; justify-content: center; }

    .container {
      width: min(100%, 804px);
      max-width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      padding: clamp(32px, 5vw, 64px) clamp(32px, 8vw, 80px);
      gap: 16px;
      border: 1px solid #6f6f6f;
    }

    @media (max-width: 964px) {
      .container {
        padding: 64px;
      }
    }

    .header {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .header-title {
      font-family: 'OCR-A-BT', monospace;
      font-size: clamp(36px, 5.6vw, 56px);
      color: var(--text-primary);
      letter-spacing: 6px;
    }

    .header-divider {
      width: 100%;
      height: 4px;
      background-image: radial-gradient(circle, var(--text-primary) 1.5px, transparent 1.5px);
      background-size: 10px 4px;
      background-repeat: space no-repeat;
      border: none;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 109px 109px;
      gap: 18px;
      align-content: center;
      flex: 1;
    }

    .card {
      background: var(--bg-surface);
      border-radius: 16px;
      padding: 20px;
      box-shadow: inset 5px 5px 10px rgba(174,174,192,0.55), inset -5px -5px 10px rgba(255,255,255,0.95);
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: space-between;
    }

    .card-header {
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex: 1;
    }

    .card-title {
      font-size: 20px;
      font-weight: 400;
      color: var(--text-primary);
      letter-spacing: 1px;
    }

    .card-description {
      font-size: 12px;
      color: var(--text-secondary);
      line-height: 1.4;
    }

    .card-visual {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .card > div:first-child {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    /* WASD cluster. Values match the inline styles these replaced, so desktop
       renders exactly as before. */
    .key-stack {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .key-row {
      display: flex;
      gap: 6px;
    }

    .key {
      width: 38px;
      height: 38px;
      background: var(--bg-base);
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      font-weight: 600;
      color: var(--text-primary);
      box-shadow: 5px 5px 12px rgba(174,174,192,0.65), -5px -5px 12px rgba(255,255,255,1);
    }

    .icon-dot {
      width: 9px;
      height: 9px;
      background: #4a4a4a;
      border-radius: 50%;
    }

    .icon-square {
      width: 30px;
      height: 30px;
      background: var(--bg-base);
      border-radius: 5px;
      box-shadow: inset 2px 2px 4px rgba(174,174,192,0.4), inset -2px -2px 4px rgba(255,255,255,0.8);
    }

    .mouse-icon {
      display: flex;
      gap: 3px;
      align-items: flex-start;
    }

    .mouse-left {
      width: 31px;
      height: 48px;
      background: var(--bg-base);
      border-radius: 28px 2px 2px 2px;
      box-shadow: -5px -5px 12px rgba(255,255,255,1), 5px 5px 12px rgba(174,174,192,0.65);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .mouse-right {
      width: 31px;
      height: 48px;
      background: var(--bg-base);
      border-radius: 2px 28px 2px 2px;
      box-shadow: inset 4px 4px 10px rgba(174,174,192,0.6), inset -4px -4px 10px rgba(255,255,255,1);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .mouse-left--pressed {
      width: 31px;
      height: 48px;
      border-radius: 28px 2px 2px 2px;
      box-shadow: inset 4px 4px 10px rgba(174,174,192,0.6), inset -4px -4px 10px rgba(255,255,255,1);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .mouse-right--raised {
      width: 31px;
      height: 48px;
      background: var(--bg-base);
      border-radius: 2px 28px 2px 2px;
      box-shadow: -5px -5px 12px rgba(255,255,255,1), 5px 5px 12px rgba(174,174,192,0.65);
    }

    .mouse-dot {
      width: 8px;
      height: 8px;
      background: #4a4a4a;
      border-radius: 50%;
    }

    .lm-button {
      width: 56px;
      height: 56px;
      background: var(--bg-base);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 23px;
      font-weight: 400;
      color: var(--text-primary);
      box-shadow: inset -6px -6px 15px rgba(255,255,255,1), inset 6px 6px 15px rgba(174,174,192,0.65);
    }

    /* ── Mobile ────────────────────────────────────────────────────────────
       These rules used to sit as bare selectors INSIDE the .lm-button block
       above, with no @media wrapper and no closing brace before them. Under CSS
       nesting they resolved to `.lm-button body`, `.lm-button .container`, etc.
       and matched nothing, so the whole mobile treatment silently never applied
       — which is why phones kept the desktop `body { padding: 32px }` band and
       the `.container` 1px border, and why the title overflowed (its base
       `white-space: nowrap` was never overridden).

       Layout now matches the fullscreen intro (controls_fullscreen3d.html),
       minus that page's two full-screen-only devices: its translucent
       rgba(220,220,227,0.85) veil and its 1px panel border. Here the surround is
       the same opaque --bg-base as the panel, and with the border gone the
       padding band is indistinguishable — one seamless surface.

       Padding matches the fullscreen panel's mobile value (28px 20px). It used to
       be `80px … 64px` to clear the 57px .overlay-topbar, but that bar has since
       been removed from this overlay in index.html, so the clearance is dead
       space — if a top bar is ever restored here, restore the 80px top too. */
    @media (max-width: 700px) {
      html, body { height: auto; overflow-y: auto; }

      body {
        padding: 0;
        justify-content: flex-start;
      }

      .container {
        width: 100%;
        height: auto;
        overflow-y: auto;
        border: none;
        /* Tighter than the other overlays' 28px/20px: at 18px the descriptions
           need every pixel of measure, and this page is the only one that was
           close to the 85vh ceiling. Buys ~8px of text width per side and ~8px
           of height. */
        padding: 24px 16px;
        gap: 20px;
      }

      .header-title {
        font-size: clamp(28px, 8vw, 56px);
        white-space: normal;
        letter-spacing: 2px;
      }

      .grid {
        grid-template-columns: 1fr;
        grid-template-rows: auto;
        gap: 16px;
      }

      .card {
        height: auto;
        padding: 16px;
        /* Guarantees clear separation between the text column and the icon.
           `justify-content: space-between` alone doesn't: it only distributes
           LEFTOVER space, so once the text grows enough to consume it the two
           blocks touch. */
        gap: 14px;
      }

      /* Let the text column own the remaining width and wrap onto two lines.
         min-width: 0 is the load-bearing part — a flex item won't shrink below
         its min-content width by default, so without it long text pushes into
         the icon instead of wrapping. */
      .card > div:first-child {
        flex: 1;
        min-width: 0;
      }

      /* The round "LM" badge in the RESET card was 56px — oversized next to the
         other cards' icons at this width. 44px is the site's standard circular
         button size (nav .logo, footer "top" button) and still meets the 44px
         minimum tap target, though this badge isn't interactive. Inset shadow
         scaled down with it so the neumorphic depth stays proportional. */
      .lm-button {
        width: 44px;
        height: 44px;
        font-size: 18px;
        box-shadow: inset -5px -5px 12px rgba(255,255,255,1), inset 5px 5px 12px rgba(174,174,192,0.65);
      }

      /* WASD keys at 50%: 38px -> 19px, with radius, gaps, font and shadow all
         halved so the cluster scales uniformly rather than just the boxes.
         The gap to the card's right edge is unchanged for free — .card is
         `justify-content: space-between`, so .card-visual stays pinned to the
         content-box edge and the 20px card padding is what sets that distance
         regardless of how wide the cluster is. */
      .key {
        width: 19px;
        height: 19px;
        border-radius: 5px;
        font-size: 8px;
        box-shadow: 2.5px 2.5px 6px rgba(174,174,192,0.65), -2.5px -2.5px 6px rgba(255,255,255,1);
      }

      .key-stack,
      .key-row { gap: 3px; }

      /* The per-control explanation was 12px VT323 — the smallest text on the
         page, in a pixel face with a small x-height, in the faint
         --text-secondary grey. Now Roboto Flex, the site's body face: real body
         copy shouldn't be set in the display font. Headings (.card-title) stay
         VT323, so the pixel face still carries the page's character.
         16px rather than the 18px used while this was VT323 — a proportional
         face reads noticeably larger at the same size, so 16px here lands about
         where 18px of VT323 did, and it's the site-wide mobile body floor.
         .card-title goes to 24px to keep a clear step above it. */
      .card-description {
        font-family: 'Roboto Flex', sans-serif;
        font-size: 16px;
        line-height: 1.45;
      }
      .card-title { font-size: 24px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1 class="header-title" data-i18n="controls-title">CONTROLS</h1>
      <hr class="header-divider" />
    </div>

    <div class="grid">
      <div class="card">
        <div>
          <div class="card-title" data-i18n="move-title">MOVE</div>
          <div class="card-description" data-i18n="move-desc">W, A, S, D or arrow keys to walk the scene</div>
        </div>
        <div class="card-visual">
          <!-- Classes rather than inline styles so the gaps can be scaled per
               breakpoint; inline styles can only be overridden with !important. -->
          <div class="key-stack">
            <div class="key">W</div>
            <div class="key-row">
              <div class="key">A</div>
              <div class="key">S</div>
              <div class="key">D</div>
            </div>
          </div>
        </div>
      </div>

      <div class="card">
        <div>
          <div class="card-title" data-i18n="camera-title">CAMERA</div>
          <div class="card-description" data-i18n="camera-desc">Rightclick or trackpad to move camera</div>
        </div>
        <div class="card-visual">
          <div class="mouse-icon">
            <div class="mouse-left"></div>
            <div class="mouse-right">
              <div class="mouse-dot"></div>
            </div>
          </div>
        </div>
      </div>

      <div class="card">
        <div>
          <div class="card-title" data-i18n="inspect-title">INSPECT</div>
          <div class="card-description" data-i18n="inspect-desc">Leftclick to select item</div>
        </div>
        <div class="card-visual">
          <div class="mouse-icon">
            <div class="mouse-left mouse-left--pressed">
              <div class="mouse-dot"></div>
            </div>
            <div class="mouse-right mouse-right--raised"></div>
          </div>
        </div>
      </div>

      <div class="card">
        <div>
          <div class="card-title" data-i18n="reset-title">RESET</div>
          <div class="card-description" data-i18n="reset-desc">Tap icon (top left) to reset to center</div>
        </div>
        <div class="card-visual">
          <div class="lm-button">LM</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // ── i18n (EN + DE) ───────────────────────────────────────────
    (function () {
      var T = {
        de: {
          'controls-title': 'STEUERUNG',
          'move-title': 'BEWEGEN', 'move-desc': 'W, A, S, D oder Pfeiltasten, um durch die Szene zu laufen',
          'camera-title': 'KAMERA', 'camera-desc': 'Rechtsklick oder Trackpad, um die Kamera zu bewegen',
          'inspect-title': 'ANSEHEN', 'inspect-desc': 'Linksklick, um ein Objekt auszuwählen',
          'reset-title': 'RESET', 'reset-desc': 'Icon (oben links) tippen, um zur Mitte zurückzukehren'
        },
        en: {
          'controls-title': 'CONTROLS',
          'move-title': 'MOVE', 'move-desc': 'W, A, S, D or arrow keys to walk the scene',
          'camera-title': 'CAMERA', 'camera-desc': 'Rightclick or trackpad to move camera',
          'inspect-title': 'INSPECT', 'inspect-desc': 'Leftclick to select item',
          'reset-title': 'RESET', 'reset-desc': 'Tap icon (top left) to reset to center'
        }
      };
      function apply(lang) {
        var t = T[lang] || T.en;
        document.querySelectorAll('[data-i18n]').forEach(function (el) { if (t[el.dataset.i18n] !== undefined) el.textContent = t[el.dataset.i18n]; });
      }
      apply(localStorage.getItem('lang') || 'de');
      window.addEventListener('storage', function (e) { if (e.key === 'lang') apply(e.newValue || 'de'); });
    })();
  </script>

  <script>
    /* ── Report content height to the 3D-view parent ───────────────────────
       Same reporter as the other overlay pages. This page has the most content
       of the four (~577px at the in-overlay width vs About's ~340px), so it
       shrinks least — from the fixed 85vh (717px) down to roughly 560-580px
       depending on language. Still under the 85vh ceiling, so it fits without
       scrolling; if copy ever grows past that the clamp takes over and it
       scrolls inside the frame as before. */
    (function () {
      var el = document.querySelector('.container');
      if (!el || window.parent === window) return;
      var last = -1;
      function report() {
        var h = Math.ceil(el.getBoundingClientRect().height);
        if (h === 0 || h === last) return;
        last = h;
        window.parent.postMessage({ type: 'overlay-autoheight', frame: 'controls', height: h }, '*');
      }
      if (window.ResizeObserver) new ResizeObserver(report).observe(el);
      window.addEventListener('load', report);
      report();
    })();
  </script>
</body>
</html>
