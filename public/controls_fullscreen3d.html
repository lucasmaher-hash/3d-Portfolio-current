<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/images/site/favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="/images/site/favicon-32.png" />
  <link rel="apple-touch-icon" href="/images/site/favicon-180.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Controls</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet" />
  <style>
    @font-face {
      font-family: 'OCR-A-BT';
      src: url('/OCR-A-BT.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
    }

    :root {
      --bg-base: #DCDCE3;
      --bg-surface: #DCDCE3;
      --text-primary: #1A1A1A;
      --text-secondary: #8E8E93;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; }
    /* slightly translucent veil over the 3D scene — only OUTSIDE the panel border;
       the panel itself is fully opaque */
    body {
      background: rgba(220, 220, 227, 0.85);
      font-family: 'VT323', monospace;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Content panel — same size as the overlay controls window (66.66vw × 66.66vh),
       whitespace around it comes from the centered flex body */
    .panel {
      width: 66.66vw;
      height: 66.66vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: clamp(24px, 4vh, 56px) clamp(28px, 6vw, 88px);
      gap: 16px;
      border: 1px solid #6f6f6f;
      border-radius: 16px;
      background: var(--bg-base); /* opaque inside the border */
    }

    .header {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .header-title {
      font-family: 'OCR-A-BT', monospace;
      font-size: clamp(36px, 4vw, 56px);
      color: var(--text-primary);
      letter-spacing: 6px;
    }

    .header-divider {
      width: 100%;
      height: 4px;
      background-image: radial-gradient(circle, var(--text-primary) 1.5px, transparent 1.5px);
      background-size: 10px 4px;
      background-repeat: repeat-x;
      border: none;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: minmax(109px, 1fr) minmax(109px, 1fr);
      gap: 18px;
      align-content: center;
      flex: 1;
      min-height: 0;
      margin-top: 8px;
    }

    .card {
      border-radius: 16px;
      padding: 20px;
      box-shadow: inset 5px 5px 10px rgba(174,174,192,0.55), inset -5px -5px 10px rgba(255,255,255,0.7);
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-height: 0;
    }

    .card > div:first-child {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .card-title {
      font-size: 20px;
      font-weight: 400;
      color: var(--text-primary);
      letter-spacing: 1px;
    }

    .card-description {
      font-size: 12px;
      color: var(--text-secondary);
      line-height: 1.4;
    }

    .card-visual {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      flex-shrink: 0;
    }

    /* Buttons / keys / icons — fully opaque, sitting on the translucent veil */
    .key {
      width: 38px;
      height: 38px;
      background: var(--bg-base);
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      font-weight: 600;
      color: var(--text-primary);
      box-shadow: 5px 5px 12px rgba(174,174,192,0.65), -5px -5px 12px rgba(255,255,255,1);
    }

    .mouse-icon {
      display: flex;
      gap: 3px;
      align-items: flex-start;
    }

    .mouse-left,
    .mouse-right,
    .mouse-left--pressed,
    .mouse-right--raised {
      width: 31px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .mouse-left {
      background: var(--bg-base);
      border-radius: 28px 2px 2px 2px;
      box-shadow: -5px -5px 12px rgba(255,255,255,1), 5px 5px 12px rgba(174,174,192,0.65);
    }
    .mouse-right {
      background: var(--bg-base);
      border-radius: 2px 28px 2px 2px;
      box-shadow: inset 4px 4px 10px rgba(174,174,192,0.6), inset -4px -4px 10px rgba(255,255,255,1);
    }
    .mouse-left--pressed {
      background: var(--bg-base);
      border-radius: 28px 2px 2px 2px;
      box-shadow: inset 4px 4px 10px rgba(174,174,192,0.6), inset -4px -4px 10px rgba(255,255,255,1);
    }
    .mouse-right--raised {
      background: var(--bg-base);
      border-radius: 2px 28px 2px 2px;
      box-shadow: -5px -5px 12px rgba(255,255,255,1), 5px 5px 12px rgba(174,174,192,0.65);
    }

    .mouse-dot {
      width: 8px;
      height: 8px;
      background: #4a4a4a;
      border-radius: 50%;
    }

    .lm-button {
      width: 56px;
      height: 56px;
      background: var(--bg-base);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 23px;
      font-weight: 400;
      color: var(--text-primary);
      box-shadow: inset -6px -6px 15px rgba(255,255,255,1), inset 6px 6px 15px rgba(174,174,192,0.65);
    }

    .start-hint {
      text-align: center;
      font-size: 18px;
      color: var(--text-secondary);
      letter-spacing: 2px;
      animation: hintPulse 1.6s ease-in-out infinite;
      user-select: none;
    }
    @keyframes hintPulse {
      0%, 100% { opacity: 0.45; }
      50%      { opacity: 1; }
    }

    @media (max-width: 700px) {
      html, body { overflow-y: auto; }
      .panel { width: 90vw; height: auto; padding: 28px 20px; }
      .grid {
        grid-template-columns: 1fr;
        grid-template-rows: auto;
        gap: 16px;
      }
    }
  </style>
</head>
<body>
  <div class="panel">
    <div class="header">
      <h1 class="header-title" data-i18n="controls-title">CONTROLS</h1>
      <hr class="header-divider" />
    </div>

    <div class="grid">
      <div class="card">
        <div>
          <div class="card-title" data-i18n="move-title">MOVE</div>
          <div class="card-description" data-i18n="move-desc">W, A, S, D or arrow keys to walk the scene</div>
        </div>
        <div class="card-visual">
          <div style="display: flex; flex-direction: column; align-items: center; gap: 6px;">
            <div class="key">W</div>
            <div style="display: flex; gap: 6px;">
              <div class="key">A</div>
              <div class="key">S</div>
              <div class="key">D</div>
            </div>
          </div>
        </div>
      </div>

      <div class="card">
        <div>
          <div class="card-title" data-i18n="camera-title">CAMERA</div>
          <div class="card-description" data-i18n="camera-desc">Rightclick or trackpad to move camera</div>
        </div>
        <div class="card-visual">
          <div class="mouse-icon">
            <div class="mouse-left"></div>
            <div class="mouse-right">
              <div class="mouse-dot"></div>
            </div>
          </div>
        </div>
      </div>

      <div class="card">
        <div>
          <div class="card-title" data-i18n="inspect-title">INSPECT</div>
          <div class="card-description" data-i18n="inspect-desc">Leftclick to select item</div>
        </div>
        <div class="card-visual">
          <div class="mouse-icon">
            <div class="mouse-left mouse-left--pressed">
              <div class="mouse-dot"></div>
            </div>
            <div class="mouse-right mouse-right--raised"></div>
          </div>
        </div>
      </div>

      <div class="card">
        <div>
          <div class="card-title" data-i18n="reset-title">RESET</div>
          <div class="card-description" data-i18n="reset-desc">Tap icon (top left) to reset to center</div>
        </div>
        <div class="card-visual">
          <div class="lm-button">LM</div>
        </div>
      </div>
    </div>

    <div class="start-hint" data-i18n="start-hint">[ click anywhere to start ]</div>
  </div>

  <script>
    // ── i18n (EN + DE) ───────────────────────────────────────────
    (function () {
      var T = {
        de: {
          'controls-title': 'STEUERUNG',
          'move-title': 'BEWEGEN', 'move-desc': 'W, A, S, D oder Pfeiltasten, um durch die Szene zu laufen',
          'camera-title': 'KAMERA', 'camera-desc': 'Rechtsklick oder Trackpad, um die Kamera zu bewegen',
          'inspect-title': 'ANSEHEN', 'inspect-desc': 'Linksklick, um ein Objekt auszuwählen',
          'reset-title': 'RESET', 'reset-desc': 'Icon (oben links) tippen, um zur Mitte zurückzukehren',
          'start-hint': '[ klicke irgendwo, um zu starten ]'
        },
        en: {
          'controls-title': 'CONTROLS',
          'move-title': 'MOVE', 'move-desc': 'W, A, S, D or arrow keys to walk the scene',
          'camera-title': 'CAMERA', 'camera-desc': 'Rightclick or trackpad to move camera',
          'inspect-title': 'INSPECT', 'inspect-desc': 'Leftclick to select item',
          'reset-title': 'RESET', 'reset-desc': 'Tap icon (top left) to reset to center',
          'start-hint': '[ click anywhere to start ]'
        }
      };
      function apply(lang) {
        var t = T[lang] || T.en;
        document.querySelectorAll('[data-i18n]').forEach(function (el) { if (t[el.dataset.i18n] !== undefined) el.textContent = t[el.dataset.i18n]; });
      }
      apply(localStorage.getItem('lang') || 'de');
      window.addEventListener('storage', function (e) { if (e.key === 'lang') apply(e.newValue || 'de'); });
    })();

    // Exact-divisor dot tiling (Safari clips partial gradient tiles — see CLAUDE.md)
    (function () {
      function fixDividers() {
        document.querySelectorAll('.header-divider').forEach(function (el) {
          var w = el.offsetWidth;
          if (!w) return;
          var n = Math.max(2, Math.round(w / 10));
          el.style.backgroundSize = (w / n) + 'px 4px';
        });
      }
      document.addEventListener('DOMContentLoaded', fixDividers);
      window.addEventListener('load', fixDividers);
      window.addEventListener('resize', fixDividers);
    })();

    // Any click / key dismisses the intro — parent fades the iframe out
    function dismiss() {
      window.parent.postMessage({ type: 'intro-controls-dismiss' }, '*');
    }
    document.addEventListener('click', dismiss);
    document.addEventListener('keydown', dismiss);
  </script>
</body>
</html>
